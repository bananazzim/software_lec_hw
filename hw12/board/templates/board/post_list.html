{% extends 'board/base.html' %}

{% block title %}
Posts
{% endblock %}

{% block content %}

<h1 class="mb-5">
    게시글 목록
</h1>

<div class="row">

{% for post in posts %}

<div class="col-md-4 mb-4">

    <div class="card h-100 p-3">

        <div class="card-body">

            <h3 class="card-title">
                {{ post.title }}
            </h3>

            <p class="card-text">
                {{ post.created_at }}
            </p>

            <a href="{% url 'post_detail' post.pk %}"
               class="btn btn-success">

                읽어보기

            </a>

        </div>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
