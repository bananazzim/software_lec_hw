{% extends 'board/base.html' %}

{% block title %}
{{ post.title }}
{% endblock %}

{% block content %}

<div class="card p-5">

    <h1 class="mb-4">
        {{ post.title }}
    </h1>

    <p class="text-secondary">
        <p style="color:#d0d0d0;"></p>
    </p>

    <hr>

    <p class="fs-5">
        {{ post.content }}
    </p>

    <a href="/posts/"
       class="btn btn-outline-success mt-4">

        목록으로

    </a>

</div>

{% endblock %}
