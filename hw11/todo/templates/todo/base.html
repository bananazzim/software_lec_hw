<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 할 일 목록</title>
    <style>
        /* 전체 배경 및 폰트 설정 */
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        /* 메인 컨테이너 (가운데 흰색 박스) */
        .container {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        /* 제목 스타일 */
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-top: 0;
        }

        /* 리스트 스타일 제거 및 여백 설정 */
        ul {
            list-style-type: none;
            padding: 0;
        }

        /* 개별 할 일 박스 */
        li {
            background-color: #fafafa;
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between; /* 내용과 버튼을 양끝으로 찢어놓음 */
            align-items: center;
            border: 1px solid #e0e0e0;
            transition: transform 0.2s;
        }
        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 버튼 기본 스타일 */
        a {
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        /* 수정 버튼 (파란색) */
        .btn-edit {
            background-color: #e3f2fd;
            color: #1976d2;
        }
        .btn-edit:hover { background-color: #bbdefb; }

        /* 삭제 버튼 (빨간색) */
        .btn-delete {
            background-color: #ffebee;
            color: #d32f2f;
            margin-left: 5px;
        }
        .btn-delete:hover { background-color: #ffcdd2; }

        /* 추가/돌아가기 버튼 (메인 하단) */
        .btn-action {
            display: inline-block;
            background-color: #4caf50;
            color: white;
            margin-top: 20px;
            margin-right: 10px;
        }
        .btn-action:hover { background-color: #45a049; }

        .btn-secondary {
            background-color: #9e9e9e;
            color: white;
        }
        .btn-secondary:hover { background-color: #757575; }

        /* 텍스트 정보 영역 */
        .item-info { flex-grow: 1; }
        .due-date { font-size: 12px; color: #888; margin-top: 5px; }
        .description { font-size: 14px; color: #666; margin-top: 3px; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 각 페이지의 내용이 이 안에 쏙 들어감 -->
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
