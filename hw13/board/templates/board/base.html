{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}George Blog{% endblock %}</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background-color:#121212;
            color:#f5f5f5;
            min-height:100vh;
        }

        .navbar{
            background-color:#1f1f1f;
        }

       .card{

            background-color:#1e1e1e;

            border:none;

            border-radius:15px;

            box-shadow:0 4px 20px rgba(0,0,0,0.3);

            transition:0.3s;
        }

        .card:hover{

            transform:translateY(-5px);

            box-shadow:0 8px 30px rgba(0,0,0,0.5);
        }

        .card-title{
            color:white;
        }

        .card-text{
            color:#e0e0e0;
        }

        a{
            text-decoration:none;
        }

        footer{
            background-color:#1f1f1f;
            padding:30px;
            text-align:center;
            margin-top:50px;
        }

    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            George Blog
        </a>

        <div>

            <a class="nav-link d-inline text-light" href="/">
                Home
            </a>

            <a class="nav-link d-inline text-light" href="/posts/">
                Posts
            </a>

            <a class="nav-link d-inline text-light" href="/about/">
                About
            </a>

            <a class="nav-link d-inline text-light" href="/projects/">
                Projects
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    {% block content %}
    {% endblock %}

</div>

<footer>
    © 2026 George Blog | Django Portfolio
</footer>

</body>
</html>
